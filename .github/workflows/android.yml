name: Android CI

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages (platform 36, NDK, CMake)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK root: $SDK_ROOT"
          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "cmdline-tools not found, bootstrapping"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Native engine unit tests (host)
        run: |
          chmod +x tools/run_native_tests.sh
          tools/run_native_tests.sh

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Report build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build.log ]; then
            echo "No build log captured." > comment.md
          else
            {
              echo "### CutVideo build diagnostics"
              echo ""
              echo '```'
              grep -nE -A3 "^(e: |FAILURE:|Execution failed|CMake Error|.*error:)" build.log | head -400
              echo '```'
              echo ""
              echo "<details><summary>tail</summary>"
              echo ""
              echo '```'
              tail -n 60 build.log
              echo '```'
              echo "</details>"
            } > comment.md
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md > /dev/null || true

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      # Ground truth on failure: which tests failed and their messages, as a commit comment
      # (the job log is the only other place this appears).
      - name: Report unit test failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          {
            echo "### CutVideo unit test failures"
            echo ""
            echo '```'
            for f in "${files[@]}"; do
              if grep -q 'failures="[1-9]\|errors="[1-9]' "$f"; then
                echo "== $(basename "$f")"
                python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for case in root.iter('testcase'):
              for bad in list(case.iter('failure')) + list(case.iter('error')):
                  print(f"FAIL {case.get('classname')} :: {case.get('name')}")
                  msg = (bad.get('message') or '')[:600]
                  print(f"  {msg}")
          PY
              fi
            done
            if [ ${#files[@]} -eq 0 ]; then echo "no test XML produced"; fi
            echo '```'
          } > testcomment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@testcomment.md > /dev/null || true

      # Proof (in the run log) that the JVM tests were actually executed, not skipped:
      # a missing report or any failure/error fails the job.
      - name: Unit test summary
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          echo "report files: ${#files[@]}"
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No unit test reports were produced"
            exit 1
          fi
          grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "${files[@]}" \
            | awk -F'"' '{t+=$2; s+=$4; f+=$6; e+=$8} END {printf "JVM tests: %d run, %d skipped, %d failures, %d errors\n", t, s, f, e; if (f+e > 0 || t < 20) exit 1}'
          echo "JVM unit tests executed with no failures (a green run means >= 20 tests ran)."


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cutvideo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
